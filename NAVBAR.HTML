<!DOCTYPE html>
<html>
<head>
    <title>navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .topnav {
            overflow: hidden;
            background-color: #333;
        }
        .topnav a {
            float: left;
            color: antiquewhite;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .topnav a:hover {
            background-color: #ddd;
            color: black;

        }
        .topnav a.active {
            background-color: #7596e2;
            color: white;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#">About-Us</a>
        <a href="#">Gallery</a>
        <a href="#">Contact-Us</a>
    </div>
    <section>
      <img class="myslides" src="https://tse3.mm.bing.net/th/id/OIP.8zhuPhutrALw2p7Jrg4ZPQHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" style="height:500px">
      <img class="myslides" src="https://tse4.mm.bing.net/th/id/OIP.u0T7VDRg_fLdDPsiwHX4XAHaE9?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" style="height:500px">
      <img class="myslides" src="https://tse3.mm.bing.net/th/id/OIP.REeJ8K0gDQpYTCKTMZj9sAHaE2?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" style="height:500px">
    </section>
    <script>
        var myIndex= 0;
        carousel();

        function carousel() {
            var i;
            var x = document.getElementsByClassName("myslides");
            for (i=0; i < x.length;i++) {
                x[i].style.display ="none";
            }
            myIndex++;
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display= "block";
            setTimeout(carousel,3000);     
        }
    </script>
</body>
</html>
