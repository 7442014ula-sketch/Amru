<!DOCTYPE html>
<html>

<body>
    <h2>javascript function</h2>
    <P>Do a calculation and display a result</P>
    <P id="demo"></P>
    <script>
        function add(a, b) {
            return a + b;
        }
        function avarage(a, b) {
            return add(a, b) / 2;
        }
        let result = average(10, 20);
        document.getElementById("demo").innerHTML = result
    </script>
</body>
</html>
