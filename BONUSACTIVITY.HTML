<!DOCTYPE html>
<html>

    <head>
         <title>my pet dog</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <body class="py-4">
            <div class="container">
                <h1 class="mb-1">MY PET DOG</h1>
                <div class="card shadows-sm mb-3" style="max-width: 400px;">
                    <div class="card-body">
                        <h5 class="card-title" style="color: chartreuse;">Contact Details</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <span class="card-label d-block">Name</span>
                                <strong id="name">-</strong>
                            </li>
                        </ul>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <span class="card-label d-block">age</span>
                                <strong id="age"></strong>
                            </li>
                            <li class="list-group-item">
                                <span class="card-label d-block">breed</span>
                                <strong id="breed">-</strong>
                            </li>
                        </ul>
                    </div>
                </div>
        <script>
            var mypetdog = {
                name: "musty",
                breed: "german shepard",
                age: "11 years old",
            };

            var nameEL = document.getElementById("name");
            var breedEL = document.getElementById("breed")
            nameEL.textContent = mypetdog.name;
            breedEL.textContent = mypetdog.breed;

            var ageEl = document.getElementById("age");
            ageEL.textContent = mypetdog.age ("age");

            var codeEL = document.getElementById("codedisplay");
            codeEL.textContent =
                'var mypetdog = {\n' +
                'name:   "' + mypetdog + '",\n' +
                'breed:  "' + mypetdog + '".\n' +
                'age:    "' + mypetdog + '",\n' +
                '};';
        </script>
        
    </body>
</html>
