<!DOCTYPE html>
<html>

<head>
    <title>MY PLANET CARDS</title>
    <style>
        body {
            font-family: arial;;
            background: antiquewhite;
            text-align: center;
        }

        h1 {
            color: chocolate;
        }

        P {
            color:grey;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .card { 
            background: white;
            border: 3px solid salmon;
            border-radius: 12px;
            padding: 20px;
            width:200px;

        }
    </style>
</head>

<body>
    <h1>My planet cards</h1>
    <p>use javascript class to build planet cards</p>
    <button onclick="showplanet()">Show planets</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class planet {
            constructor(name,fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ":" + this.fact;
            }
        }

        function showplanet() {
            let p1 = new planet("earth" , "the only planet with life");
            let p2 = new planet("mars" , "khown as the red giant");
            let p3 = new planet("saturn" , "known as the gas giant");

            document.getElementById("card1").innerHTML = 
            "<div class='card'><div class='planet-name'>" + p1.name + "</div>" + "<div class='planet-fact'>" + p1.describe() + "</div></div>"

            document.getElementById("card2").innerHTML =
                "<div class='card'><div class='planet-name'>" + p2.name +  "</div>" + "<div class='planet-fact'>" + p2.describe() + "</div></div>"

            document.getElementById("card3").innerHTML =
                "<div class='card'><div class='planet-name'>" + p3.name +  "</div>" + "<div class='planet-fact'>" + p3.describe() + "</div></div>"
        }
    </script>
</body>

</html>
